# Membangun installer Windows (.exe) secara otomatis di server GitHub.
# Cara pakai: setelah kode di-push, buat tag versi (contoh: v3.4.1). Installer akan muncul
# di halaman Releases. Bisa juga dijalankan manual lewat tab Actions > "Run workflow".
name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun installer + versi portable
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Simpan hasil build (untuk run manual)
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: dist/*.exe

      - name: Lampirkan ke GitHub Release (hanya saat ada tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
